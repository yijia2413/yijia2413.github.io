- title: "扫到的 MCP 工具，默认先关着"
  date: "2026-10-06"
  url: /frontier/2026-10-06-mcp-tools-start-off.html
  summary: "Uber 把内部 API 扫进统一的 MCP 注册表。扫到只是登记。每个 server 和每个工具一开始都是关闭的，所属团队审查之后才打开。"
- title: "测过的优化，为什么还在跑"
  date: "2026-10-05"
  url: /frontier/2026-10-05-tested-opt-still-running.html
  summary: "一项 Agent 优化通过了最初的全部测试，运行成本也更低。但授权规则变更后，它仍沿用旧的权限判断继续执行。归档里已有正确修复，系统却因为旧版本的历史分数更高，一直没有换上。"
- title: "我们 vibe coding 出来的网站，为什么看起来像设计师做的"
  date: "2026-10-01"
  url: /frontier/vibe-coded-website.html
  summary: "Railcode 创始人 Yakko Majuri 用编码代理做网站，从一条过山车动画逐步做出整座乐园。他保留了失败的原型，也记录了每次改动的提示词。这个过程比最终页面更有参考价值：设计方向怎么选、哪些尝试被放弃，以及细节怎样逐步统一。"
