# 前沿技术栏目：独立 HTML 洞察索引。
# 新增一篇：把 HTML 放到 /frontier/<slug>.html，再在这里加一条。
- title: "合并翻倍，回退掉了四成以上。人还在读每一行吗"
  date: "2026-10-17"
  url: /frontier/2026-10-17-code-review-at-anthropic.html
  summary: "Claude Code 团队 2026 年 10 月 15 日写自己的代码评审。6 月到 9 月合并的拉取请求翻了一倍以上，必须回退的比例掉了四成以上。人的时间按每条请求的批准数、评论数和等待时长来量，护栏是回退和事故。内部实质评论从 16% 到 54% 是 3 月发布说明的口径；日合并 2,500 到 30,000 是单体仓库，不是这个仓。"
- title: "怎么把一件事交给模型时做得更大胆"
  date: "2026-10-17"
  url: /frontier/2026-10-17-how-to-be-more-ambitious.html
  summary: "Felix Rieseberg 做 Claude。2026 年 10 月 13 日他把「更大胆」拆成速度、高度、深度、广度，速度整节跳过。这篇留下后三类：高度问下一步要发生什么，深度换工具不换说法，广度借别的行当的做法、不借文风。他那条「把目标定得离谱再告诉模型这很合理」我没写成建议。"
- title: "修好的最后一站，报告仍差 34.8 个点"
  date: "2026-10-15"
  url: /frontier/2026-10-15-gap-remains-after-fix.html
  summary: "一篇预印本用同一批问题去问编码 Agent 的例行报告和完整执行记录。37 个任务、4,799 条有效探针上，报告答对 52.0%，完整记录答对 92.7%，差 40.7 个点（95% 区间 37.3 至 43.8）。隐藏测试判为修好的 30 条里，最后一站仍差 34.8 个点（区间 28.2 至 41.3），30 条里 28 条任务差为正。34.8 是加权准确率的净差，不是报告里有 34.8% 的状态完全答不上。"
- title: "整池口径下，复现成功撑不起联合验收"
  date: "2026-10-14"
  url: /frontier/2026-10-14-reproduction-is-not-validation.html
  summary: "一篇预印本把 12 套编码 Agent 生成的测试回放到 619 个先去掉容易复现任务的仓库问题上。候选补丁来自轨迹，由官方评测打标签。八个代表配置的联合验收率都低于 10%，最高 9.21%（95% 区间 6.95% 至 11.47%）；复现率最高 68.17%。联合验收要求同一条任务上错误池全拦住、正确池全放过。前三名的差距区间含 0。"
- title: "评审团更一致了，和人的一致没有跟着涨"
  date: "2026-10-13"
  url: /frontier/2026-10-13-judge-consensus-not-alignment.html
  summary: "一篇预印本按评审团内部的分歧定位并改写评分标准的条款，全程不读人工标签。SummEval 上五个评审之间的 Krippendorff α 比原标准高 0.069（95% 区间 0.046 至 0.092），评审团和专家评分的 Kendall τ 差 −0.007（区间 −0.037 至 0.021）。HealthBench 和 USR 上两项都没达到预设的效果标准。改同样多随机条款的对照组，对人一致的点估计在三个数据集上都更高，区间都含零。"
- title: "决策单价降了七成，账要按每个成功交付算"
  date: "2026-10-12"
  url: /frontier/2026-10-12-cost-per-delivered-success.html
  summary: "一篇预印本把 Jev 接进五个 Agent 的选动作位置，在 ALFWorld 和 AndroidWorld 上跑了 4,500 次任务执行。单次决策的成本降 66.1% 至 78.4%，五个 Agent 都降。按每个成功交付算，T3A 每次尝试便宜 17.1%，每个成功交付的均值从 68.70 涨到 73.97 mUSD（差值的 95% 区间跨零），另外四个 Agent 每个成功交付的成本仍然下降；FastAgent 每交付一个成功的用时从 239.4 秒涨到 377.8 秒（区间整段为正）。"
- title: "护栏的选项名也是输入，换对一个词就放行"
  date: "2026-10-11"
  url: /frontier/2026-10-11-option-labels-are-input.html
  summary: "一篇预印本把小型决策模型放在 Agent 的放行位上测。待判文本和选项定义不动，只给放行选项换名字，在 198 个候选里取最强的一个，四个把选项名送进输入的模型漏拦率到 98.2% 至 100%（GuardBench 六条策略平均）。另两个不受影响，因为调用库只拼定义。被翻掉的判决置信度没有变低。"
- title: "技能库自动改写，该盯的是原本稳定的任务还稳不稳"
  date: "2026-10-10"
  url: /frontier/2026-10-10-watch-regressions-not-coverage.html
  summary: "一篇预印本把五种技能演化方法放在同两套技能库上对比。算子生成那套上，覆盖面最高的两个方法打平在 14/15，三次全过差 20 个百分点。490 个任务里改好的数量接近，变差的 9 对 36。"
- title: "撤稿的三篇，都在 Lean 没盖到的那一半"
  date: "2026-10-08"
  url: /frontier/2026-10-08-withdrawals-outside-lean-coverage.html
  summary: "OpenAI 放出 719 份数学稿，形式化覆盖 300 条顶层结果。隔天撤 3 篇修 14 篇，撤掉的三篇在两版形式化目录里都没出现。一个符号错误沿引用链传了两层，形式化目录自标未审查。"
- title: "Harness 是什么：套在模型外面的那层软件"
  date: "2026-10-07"
  url: /frontier/2026-10-07-what-is-a-harness.html
  summary: "Earendil 把 agent harness 拆成系统提示、工具、循环、翻译层。用户能拥有并改这层软件，同一套带子可以换模型。Pi 用户互相分享了超过 5000 个扩展。"
- title: "扫到的 MCP 工具，默认先关着"
  date: "2026-10-06"
  url: /frontier/2026-10-06-mcp-tools-start-off.html
  summary: "Uber 的 MCP 网关把内部 API 扫进注册表。每个工具一开始是关闭的，所属团队审查后才打开。当时托管超过 800 个 server、超过 5000 个工具。"
- title: "测过的优化，为什么还在跑"
