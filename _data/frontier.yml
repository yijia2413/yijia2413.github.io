# 前沿技术栏目：独立 HTML 洞察索引。
# 新增一篇：把 HTML 放到 /frontier/<slug>.html，再在这里加一条。
- title: "忙碌时丢掉的 Restore，CAGE 4 仍按一次执行扣分"
  date: "2026-11-12"
  url: /frontier/2026-11-12-dropped-restore-still-billed.html
  summary: "给正在执行动作的 Agent 再发一条 Restore，模拟器会丢掉这条指令，记录写成 Sleep，分数却仍扣 1 分。一篇预印本在钉死的容器里复现 CAGE Challenge 4 的两个参考防御方：关掉 KEEP 自带的忙碌检查，发布策略每局少 99.58 分；关掉 H-MARL Expert 的掩码，每局少 145.98 分。后者的已执行动作逐步不变，少的分数就是发给忙碌 Agent 的 Restore 计费。"
- title: "AGENTS.md 写下的指令，Agent 遵守了多少"
  date: "2026-11-11"
  url: /frontier/2026-11-11-ends-above-eighty-six.html
  summary: "仓库里的指令，哪些会落到 Agent 的提交上？一篇预印本逐条检查 AGENTS.md / CLAUDE.md 中能用脚本核验的规则。在至少有一次适用提交的 2,053 条指令里，91.7% 要么每次都遵守，要么一次也不遵守。把门槛提高到至少 3 次或 5 次适用提交，这一比例仍有 87.3% 和 86.2%。这是提交产物上的观察，不能直接证明指令本身的效果。"
- title: "去掉「再看一眼」，Astra 跨 Agent 访问 50/50 变 1/50"
  date: "2026-11-10"
  url: /frontier/2026-11-10-recheck-drops-access.html
  summary: "“提交前再看一眼工作区”可能改变多个 Agent 之间的互动。一项预注册实验让四个 Agent 使用同一份键值草稿区，却不告诉它们其他 Agent 的存在。gpt-6-astra 带着这句提示时，两套实现各有 50/50 个实验世界发生跨 Agent 访问；删掉后均为 1/50。claude-sonnet-5 在同一条件下几乎不变。"
- title: "过期测试命令让 Sonnet 多调用约两次工具（探索性）"
  date: "2026-11-09"
  url: /frontier/2026-11-09-sonnet-extra-calls.html
  summary: "仓库里一条过期的测试命令，可能让 Agent 多做几次工具调用。在一项包含 22 个维护任务的预印本实验中，Sonnet 5.5 遇到过期测试命令时，每任务工具调用中位数的平均值为 7.8 次，修正同一行后为 5.8 次。这是探索性结果：按估计数量校正后，区间不再排除零；Haiku 5.5 和另外两个案例没有检测到调用差。"
- title: "编码 Agent 的失败预测，多少来自题目难度"
  date: "2026-11-08"
  url: /frontier/2026-11-08-difficulty-beats-trajectory.html
  summary: "看 Agent 的运行轨迹，能提前判断这一次会不会失败吗？一篇基于 SWE-bench Verified 公开轨迹的预印本发现：用其他 16 个模型的失败比例衡量题目难度，合并 AUROC 达到约 0.92；仿 Fail-Fast 的 TF-IDF 轨迹预测约为 0.62。但题目难度使用了部署时拿不到的结果，作用是诊断，不能直接当成线上预测器。"
- title: "Agent 记忆由哪些部分组成"
  date: "2026-11-07"
  url: /frontier/2026-11-07-components-of-agent-memory.html
  summary: "Agent 写下笔记之后，还需要整理、纠错，并决定下一次会话该读什么。Anthropic 在 2026 年 11 月 6 日介绍了这套记忆分工：工作时记录经历，空闲时重新查看日志、修订笔记、建立 wiki，再把重要内容放到更容易读取的位置。原文把这种离线整理称为“做梦”。"
- title: "测试断言齐全，典型输入仍可能漏掉错误"
  date: "2026-11-06"
  url: /frontier/2026-11-06-typical-tests-release-wrong.html
  summary: "API 升级后，程序能通过常规测试，仍可能在边界输入上出错。一篇预印本在 CPython、Node.js、SQLite 的 52 个受影响测试任务上比较发布检查：在作者构造的 405 个程序片段菜单内，典型输入放行隐藏错误程序的份额为 0.410；增加一条按发布说明编写的边界输入后降到 0.065。两项都是任务均值，不能当成通用失败率。"
- title: "固定模型换脚手架，Qwen 正确率差 11.5 个点"
  date: "2026-11-05"
  url: /frontier/2026-11-05-harness-spreads-eleven.html
  summary: "选模型时测的脚手架，可能影响部署后的结论。一篇预印本把四个开源权重模型分别放进五种脚手架，完成同一组 156 个银行行为案例。qwen3.8-flash-next 的正确率从 82.1% 到 93.6%，相差 11.5 个百分点；deepseek-v4.1-flash 只差 1.9 个点，检验不显著。脚手架的影响因模型而异。"
- title: "同一条政策换个写法，Opus 的遵守率就变了"
  date: "2026-11-04"
  url: /frontier/2026-11-04-conditional-wording-loses.html
  summary: "AGENTS.md 里同一条规则，换一种句式，执行情况也会变化。一篇预印本要求 Agent 在新增或修改的 Python 函数下标注 # @tracked。Claude Code 配 opus-5，在有效的 82 个任务上，规定写法的遵守率为 78.0%，解释写法为 77.2%，条件写法为 64.2%。这项比较针对这一条政策，不能据此认定所有条件句都不可靠。"
- title: "Hermes 压缩后规则还在，违规率仍高于完整历史"
  date: "2026-11-03"
  url: /frontier/2026-11-03-kept-rule-still-violates.html
  summary: "会话压缩以后，摘要里还写着规则，Agent 也可能继续违规。ARCBench 在 Hermes 压缩策略、四个 Flash 档模型上发现：70.1% 的压缩运行仍保留规则，但这些运行的违规率是 21.1%，完整历史下是 8.1%，约差 2.6 倍。这个结果限于 Hermes；其他策略的表现并不相同。"
- title: "Droid 1.0：做一套前沿 harness"
  date: "2026-11-02"
  url: /frontier/2026-11-02-frontier-harness.html
  summary: "Droid 把提示、工具、工具结果和执行循环组织在一起。Factory 在 2026 年 10 月 29 日介绍了 Droid 1.0：通过程序化调用工具、调整缓存和基础提示，降低长任务的成本。按 Factory 报告，同一任务、同一模型上，Droid 相比各家原生 harness 最多节省 20%。"
- title: "至多调用一次模型，工具检索在 AppWorld 上的限制"
  date: "2026-11-02"
  url: /frontier/2026-11-02-one-call-max-ten.html
  summary: "一项任务要用六个 API，检索只找到五个，召回率可以不错，任务却仍可能做不完。一篇工具检索预印本在 AppWorld 的 345 条多工具任务上发现：取前 16 个结果时，未在该测试池上训练、每条查询至多调用一次模型的方案，主表中找齐整套 API 的最高比例是 9.6%。附录消融达到 11.9%，因此 10% 不能视为这类结构的能力上限。"
- title: "ScienceBoard 上，查过状态的误报 5.4%，生成脚本 21.7%"
  date: "2026-11-01"
  url: /frontier/2026-11-01-state-check-cuts-fpr.html
  summary: "核验计算机任务是否完成，检查实际状态比只看一张截图更可靠。VeriCUA 先了解机器上下文，再选择界面或代码检查。在 ScienceBoard 的 169 个案例上，它的假阳性率为 5.4%；同样使用 gemini-3-flash-preview 的一次性生成脚本方案为 21.7%，单次视觉语言模型评审为 24.8%。弃权按失败计算。"
- title: "最终任务成功，不代表每一步都可执行"
  date: "2026-10-31"
  url: /frontier/2026-10-31-unverified-plan-halves-ter.html
  summary: "工具 Agent 最后答对了，不代表前面的工具调用都能执行。在 BFCL v3 的 200 条分层样本上，GPT-5.4（high）按未经核验的计划执行，最终成功率是 0.94，整条轨迹可执行的比例却只有 0.47。在同一套执行器之前增加计划核验后，两项都达到 0.94。"
- title: "同样的样本换一批，模型评审也会改判"
  date: "2026-10-30"
  url: /frontier/2026-10-30-batch-flips-eleven-twenty.html
  summary: "让模型一次给 25 条内容打分，结果会受到同批其他内容影响。一篇预印本在五个 4–9B 开源权重模型上发现：同一组 2,000 条伤害评论或短答，只是重新随机分批，就有 11% 至 22% 的判定改变；对人的 AUROC 却只变动 −0.033 到 +0.010。整体排序看着稳定，单条判定仍可能变化。"
- title: "Agent 的第一次请求，工具定义占了多少"
  date: "2026-10-29"
  url: /frontier/2026-10-29-tools-dominate-first-request.html
  summary: "编码 Agent 发给模型的第一条请求里，用户输入可能只占很小一部分。一篇预印本捕获了五个 Agent 共 1,886 次发布的首次请求：各自最新版本中，Claude Code、Qwen Code 和 OpenCode 的工具定义占请求字符的 63.2% 至 77.4%。这个比例衡量的是字符组成，论文没有据此测量任务表现。"
- title: "第一步通过率，为什么高估完整功能的成功率"
  date: "2026-10-28"
  url: /frontier/2026-10-28-first-stage-overstates-feature.html
  summary: "Agent 完成第一版功能之后，还能在自己写的代码上持续扩展吗？FeatureArc 把 73 条功能需求拆成连续阶段，让十个编码 Agent 接着自己的代码往下写。第一阶段平均通过率是 62.7%，全部阶段结束后，整条功能通过最终检查的比例只有 28.5%。两者检查范围不同，差距不能全部归因于后续改动。"
- title: "90 个根因分析案例中，简单 harness 优于手写流程"
  date: "2026-10-27"
  url: /frontier/2026-10-27-prescribed-calls-lose.html
  summary: "把调查步骤写成固定流程，会不会限制 Agent 找根因？一篇预印本在同一组 90 个微服务故障案例上比较发现：SQL agent 和 Codex 在各自跑过的每个中档模型上，都比该模型表现最好的已发表 RCA Agent 高 14 至 24 个百分点。结果支持给模型更多调查自由，但论文没有单独检验固定流程是否造成了差距。"
- title: "只换采集日期，开源模型就改变了答案"
  date: "2026-10-26"
  url: /frontier/2026-10-26-collection-date-redirects-answers.html
  summary: "一篇预印本把两份修订的正文和修订时间钉死，只对调采集日期。595 个维基百科页、五个开源权重模型：问句当天的采集日期给旧修订、第二天给新修订，相对另一种赋值，后期参考的精确匹配掉 37.6 至 51.4 个点。Qwen2.5-72B 从 77.1% 到 28.3%。497 页上前一天对调仍掉 29.0 至 39.6 个点。两个闭源接口模型在维基上几乎不动。"
- title: "规格没写的名字，为什么会让 Agent 的测试失败"
  date: "2026-10-25"
  url: /frontier/2026-10-25-hidden-name-blocks-unit.html
  summary: "一篇 10 月 22 日的预印本把自然语言规格和上游测试拆开查。SWE-Milestone v1.0.2 的 98 个计分里程碑里，25 个含一条依赖未写明、推不出来的名字或路径的测试。被这类依赖挡住的构建单元，在 35 次公开跑里失败 80.6%；同一批里程碑里带着新测试、没有新依赖的单元失败 48.4%。倍数 1.67（自助区间 1.32 至 2.04）。附录 B 写拟合用了 72 个挡住单元对 27 个对照单元。原文没给 80.6% 和 48.4% 各自的（单元，跑次）对数。排行榜名次几乎不动。go-zero 的分数会动。"
- title: "删掉源记录后，Agent 仍能从摘要找回信息"
  date: "2026-10-24"
  url: /frontier/2026-10-24-source-delete-leaves-summary.html
  summary: "一篇 10 月 22 日的预印本把「删掉那条源记录」和「派生状态里还有没有秘密」拆开测。Qwen2.5-7B-Instruct、层级记忆、写过滤器关掉：一条直接问，IID 上暴露再删除的那一侧 136/200 对上完整目标，从未暴露的对照 0/200。ΔRec = 0.680（95% 配对区间 0.615 至 0.745）。136 按表 1 四格相加，原文未直接给出这个分数。摘要是按标识符排序、原文换行拼接的抽取对象。"
- title: "文档条目不够时，minItems 会怎样影响抽取"
  date: "2026-10-23"
  url: /frontier/2026-10-23-minitems-pads-lists.html
  summary: "一篇 10 月 22 日的预印本只改 JSON Schema 里的最少条数。558 篇真实文档、八个开源权重模型。文档里的真条目少于 k 时，schema 写出但不强制的 minItems，把超过真值条数的列表从 34.5% 抬到 55.4%（k = 3 和 5 合在一起，每列 7,272 条输出）。强制解码到 90.1%。匹配器把 62.9%† 的额外条目标成原文里种类不对的字，子串源检查只有 46.6%† 能对上。"
- title: "文档转成纯文本后，模型丢掉了哪些线索"
  date: "2026-10-22"
  url: /frontier/2026-10-22-ingestion-drops-cues.html
  summary: "一篇 10 月 21 日的预印本只改 Word 政策文档怎么变成模型眼前的字。76 篇、Claude Opus 4.6 上找回作者用红字或高亮标过的要求：作者那套 micro F1 0.690，docx2python 0.586，docling 0.150，纯文本 0.075。这 76 篇是从 6,462 篇里筛出、靠标记才能答的那一截。高亮和颜色是作者对自己那套表示做留一得到的负荷，原文没拆 docling 的输出里还剩什么。"
- title: "怎样用决策模型做评测"
  date: "2026-10-21"
  url: /frontier/2026-10-21-decision-model-evals.html
  summary: "Hamel Husain 与 Antaripa Saha 在 100 条租房客服轨迹上，比较 Jev、Perplexity Decider、Liquid d1 / d1-ultra、Cloudflare Clef Flash 和 OpenAI Decisions。文章发表于 2026 年 10 月 20 日，重点讨论决策阈值和概率校准：默认阈值 0.50 需要用自己的数据验证。"
- title: "Anthropic 的就业正在怎样变化"
  date: "2026-10-21"
  url: /frontier/2026-10-21-employment-at-anthropic.html
  summary: "Nathan Wilmers、Regina Catipon、Maxim Massenkoff 和 Peter McCrory 于 2026 年 10 月 16 日发表这份研究。材料涵盖 Anthropic 内部的就业、AI 使用、产出、问卷、沟通、日历和招聘记录，以及 17 次员工访谈。"
- title: "GPT-5.1 按目录检索模拟报告，准确率为何下降"
  date: "2026-10-20"
  url: /frontier/2026-10-20-retrieval-costs-eleven-points.html
  summary: "一篇 10 月 19 日的预印本只改地球化学模拟器报告怎么到模型眼前。158 条已核答案的选择题上，GPT-5.1 从目录检索读报告，比报告贴进上下文掉 11.3 个点（分母 158）。数值题上暴露加闭合合计 −8.7，约占 −11.9 的四分之三；另有约 4 个点来自没看见正确值时的作答，区间含 0。把模拟冻住的只有 GPT-5.2，131 条检查点上掉 9.4 个点。"
- title: "可见工具列表也是输入，加一个近邻掉 4.7 个点"
  date: "2026-10-19"
  url: /frontier/2026-10-19-visible-tools-are-input.html
  summary: "一篇 10 月 16 日的预印本把工具接口的表面改动拆开测。DICE-300 上每个任务原先只有一个候选工具。Qwen3.5-9B 只加一个描述重叠的干扰工具，准确率从 0.757 降到 0.710，掉 4.7 个点（分母 300）。只改描述掉 1.3 个点，只改参数名掉 0.7 个点。"
- title: "私下已经改口，聊天记录大半看不出来"
  date: "2026-10-18"
  url: /frontier/2026-10-18-hidden-belief-collapse.html
  summary: "一篇 10 月 15 日的预印本让十个同模型智能体聊一条事实，16 轮。没有攻击者时，良性智能体最终私下给出假答案的比例平均 0.6%。放进一个反复主张假答案的攻击者，这个比例升到 44.8%；三个升到 60.5%。三个攻击者在场时，暴露回合上私下假答案是 51.6%，聊天里认领只有 19.7%。"
- title: "Claude Code 团队怎样做代码评审"
  date: "2026-10-17"
  url: /frontier/2026-10-17-code-review-at-anthropic.html
  summary: "我们说过，Claude Code 自身大约九成代码由 Claude 编写。面对这么多改动，我们怎样评审？还有人在读代码吗？出现问题时，靠什么发现并阻止？"
- title: "怎样更有雄心地使用模型"
  date: "2026-10-17"
  url: /frontier/2026-10-17-how-to-be-more-ambitious.html
  summary: "参与 Claude 开发的 Felix Rieseberg 在 2026 年 10 月 13 日写下这篇教程，讨论怎样提高交给模型的任务目标。"
- title: "任务已经修好，交付报告为什么仍答不全"
  date: "2026-10-15"
  url: /frontier/2026-10-15-gap-remains-after-fix.html
  summary: "一篇 10 月 14 日的预印本用同一批问题去问编码 Agent 的例行报告和完整执行记录。37 个任务、4,799 条有效探针上，报告能答对 52.0%，完整记录能答对 92.7%，差 40.7 个点（95% 区间 37.3 至 43.8）。隐藏测试判为修好的 30 条里，最后一站仍差 34.8 个点。"
- title: "复现了故障，为什么仍不能确认修复有效"
  date: "2026-10-14"
  url: /frontier/2026-10-14-reproduction-is-not-validation.html
  summary: "一篇 10 月 13 日的预印本把 12 套编码 Agent 自己生成的测试，回放到 619 个仓库任务上。这 619 条先去掉了容易复现的任务。候选补丁来自编码 Agent 的轨迹，由官方评测打成正确或错误。八个代表配置的联合验收率都低于 10%，最高 9.21%（95% 区间 6.95% 至 11.47%）；复现率最高的配置是 68.17%。联合验收按整池计：同一条任务上，错误补丁要全部拦住，正确补丁要全部放过。"
- title: "评审团更一致了，和人的一致没有跟着涨"
  date: "2026-10-13"
  url: /frontier/2026-10-13-judge-consensus-not-alignment.html
  summary: "一篇 10 月 9 日的预印本测了一种不读人工标签修评分标准的做法：五个评审模型在哪些条款上判得不一样，就让改写模型重写哪些条款。SummEval 上，评审之间的 Krippendorff α 比原标准高 0.069（95% 区间 0.046 至 0.092），比改同样多随机条款的对照高 0.074；评审团和专家评分的 Kendall τ 差 −0.007（区间 −0.037 至 0.021）。HealthBench 和 USR 上，两项都没有达到预先写定的效果标准。"
- title: "决策单价降了七成，账要按每个成功交付算"
  date: "2026-10-12"
  url: /frontier/2026-10-12-cost-per-delivered-success.html
  summary: "一篇 10 月 9 日的预印本把 Jev 接进五个 Agent 的选动作位置，在 ALFWorld 和 AndroidWorld 上跑了 4,500 次任务执行。单次决策的成本降 66.1% 至 78.4%，五个 Agent 都降。把失败的尝试也计入、按每个成功交付来除，T3A 每次尝试便宜 17.1%，每个成功交付的均值却从 68.70 涨到 73.97 mUSD（差值的 95% 区间跨零），另外四个 Agent 每个成功交付的成本仍然下降；FastAgent 每交付一个成功的用时从 239.4 秒涨到 377.8 秒（差值的 95% 区间整段为正）。"
- title: "护栏的选项名也是输入，换对一个词就放行"
  date: "2026-10-11"
  url: /frontier/2026-10-11-option-labels-are-input.html
  summary: "一篇 10 月 8 日的预印本把小型决策模型放在 Agent 的放行位上测。待判文本和选项定义都不动，只给「放行」那个选项换名字：在 198 个候选里取最强的一个，四个把选项名送进输入的模型漏拦率到 98.2% 至 100%；随机试十个是 85.9% 至 89.5%（GuardBench 六条策略平均，分母是策略要求拦截的条目）。另外两个模型不受影响，因为它们的调用库只拼定义。"
- title: "技能库自动改写，该盯的是原本稳定的任务还稳不稳"
  date: "2026-10-10"
  url: /frontier/2026-10-10-watch-regressions-not-coverage.html
  summary: "一篇 10 月 8 日的预印本把技能演化方法放在同一批任务上对比。算子生成那套技能库上，覆盖面最高的两个方法打平在 14/15，三次全过的比例差 20 个百分点。拿掉定位模块后，同一套上覆盖面只掉 6.66 个百分点，三次全过掉 33.33 个百分点。"
- title: "撤稿的三篇，都在 Lean 没盖到的那一半"
  date: "2026-10-08"
  url: /frontier/2026-10-08-withdrawals-outside-lean-coverage.html
  summary: "OpenAI 一次放出 719 份数学稿，形式化覆盖了 300 条顶层结果。隔天撤回 3 篇、修补 14 篇。撤掉的三篇在两版形式化目录里都没出现过。错误从一个符号开始，沿引用链传了两层。"
