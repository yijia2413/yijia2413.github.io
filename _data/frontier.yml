  summary: 2025H2–2026 公开增量在冻底座改 harness 和记忆、折叠工作窗、harness 蒸馏；开放 RSI 还没跨过评估器。
- title: "递归自改进：从 Gödel 机到 LLM Agent"
  date: "2026-09-26"
  url: /frontier/rsi-llm-agent-self-evolution.html
  summary: "一个系统能修改自己的代码，还不等于它能持续改进自己的改进方法。递归自改进（RSI）关注后一步。本文从 Gödel 机的形式证明讲起，梳理 LLM 时代如何用基准测试、沙箱和候选档案替代难以完成的证明，并区分修改权重、修改工具与修改改进器这几种路线。"
- title: "知识蒸馏：从软标签到 On-Policy Distillation"
  date: "2026-09-26"
  url: /frontier/knowledge-distillation-to-opd.html
  summary: "知识蒸馏让学生模型学习教师模型的行为。它既可以缩小模型，也可以把推理能力、多个专家的输出或长思维链转移到另一个模型里。本文沿着 2006 年的模型压缩、Hinton 的软标签、LLM 序列蒸馏，讲到 2025–2026 年的 On-Policy Distillation（OPD）：学生在自己生成的状态上向教师学习。"
